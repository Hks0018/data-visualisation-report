<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{color-scheme:light}body{margin:0}</style>
<meta charset="utf-8">
<title>DOUBLEA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Nunito:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: floating navy top bar, white work cards on a light-blue canvas, detail drawer slides over from the right. Colours follow the Nians logo: navy, blue, cyan, black. */
:root {
  color-scheme: light;
  --bg: #EDF7FA;
  --surface: #FFFFFF;
  --card: #FFFFFF;
  --surface-2: #F1F7FA;
  --line: rgba(6,44,87,.12);
  --hl: rgba(6,44,87,.1);
  --fg: #0A1118;
  --fg-2: #2D3A46;
  --muted: #5F6B77;
  --accent: #05529C;
  --accent-ink: #063F78;
  --accent-soft: rgba(5,82,156,.11);
  --on-accent: #FFFFFF;
  --teal: #2196B5;
  --navy: #062C57;
  --cyan: #22ADC5;
  --shadow: 0 1px 2px rgba(6,44,87,.05), 0 12px 32px rgba(6,44,87,.07);
  --frame-shadow: 0 30px 80px rgba(6,44,87,.28);
  --glass-dark: rgba(6,44,87,.96);
  --glass-panel: rgba(255,255,255,.7);
  --glass-shadow: 0 30px 80px rgba(6,44,87,.12), inset 0 1px 0 #fff;
  --s-chatgpt: #05529C;
  --s-gemini: #2196B5;
  --s-overview: #FFB507;
  --s-mode: #062C57;
  --s-neg: #B41616;
  --s-pos: #28A745;
  --s-neu: #FFB404;
  --s-none: #B6C1CC;
  --chip1-bg: rgba(5,82,156,.13); --chip1-fg: #063F78;
  --chip2-bg: rgba(253,126,20,.17); --chip2-fg: #8A4300;
  --chip3-bg: rgba(255,181,7,.26); --chip3-fg: #6B4A00;
  --chip4-bg: rgba(34,173,197,.16); --chip4-fg: #0B6579;
  --chip5-bg: rgba(6,44,87,.1); --chip5-fg: #062C57;
  --chip6-bg: rgba(205,239,245,.75); --chip6-fg: #0B5A70;
  --font: 'Nunito', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-head: 'Poppins', 'Nunito', ui-sans-serif, system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* cards */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); min-width: 0; }
.pad { padding: 16px 18px; }
.card h2 { margin: 0; font-size: 15px; line-height: 1.3; }
.card .sub { color: var(--muted); font-size: 12.5px; }
.grid-stats { display: flex; flex-wrap: wrap; gap: 14px; }
.grid-stats > .stat { flex: 1 1 230px; min-width: 0; }
.stat { padding: 20px 22px 16px; display: flex; flex-direction: column; gap: 10px; border-radius: 26px; transition: border-color .2s; }
.stat:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.stat .sh { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.stat .l { font-size: 13.5px; color: var(--fg-2); font-weight: 500; }
.dpill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px 3px 7px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 11.5px; font-weight: 500; color: var(--fg-2); white-space: nowrap; }
.dpill svg { width: 13px; height: 13px; }
button.dpill { font-family: inherit; cursor: pointer; }
button.dpill:hover { border-color: var(--accent); color: var(--accent-ink); }
.big { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; font-size: 46px; line-height: 1.05; font-weight: 600; letter-spacing: -.035em; font-variant-numeric: tabular-nums; }
.big small { font-size: 15px; font-weight: 500; letter-spacing: 0; color: var(--muted); }
.stat .s { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.spark { position: relative; height: 64px; margin-top: auto; cursor: crosshair; }
.spark svg { width: 100%; height: 100%; display: block; overflow: visible; }
.spark .ln { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.spark .gl { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 5; vector-effect: non-scaling-stroke; }
.sd { position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: var(--accent); border: 2px solid var(--card); box-shadow: 0 0 0 1px var(--accent); pointer-events: none; }
.sd.hv { display: none; background: var(--card); }
.charts { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; }
.charts > .chart { flex: 1 1 340px; min-width: 0; }
.chart { padding: 22px 24px 18px; display: flex; flex-direction: column; gap: 14px; border-radius: 26px; }
.chart h2 { font-size: 17px; letter-spacing: -.015em; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.note { font-size: 12px; color: var(--muted); }
/* ledger */
.ledger { display: flex; flex-direction: column; }
.lrow { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 9px 8px; margin: 0 -8px; width: calc(100% + 16px); border: 0; border-bottom: 1px dashed var(--line); border-radius: 10px; background: transparent; text-align: left; }
.lrow:last-child { border-bottom: 0; }
div.lrow { cursor: default; }
button.lrow:hover { background: var(--surface-2); }
.rk { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.lm { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.lt { font-size: 13px; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 7px; }
.ltr { height: 4px; border-radius: 2px; background: var(--accent-soft); overflow: hidden; }
.ltr i { display: block; height: 100%; background: var(--accent); border-radius: 2px; min-width: 2px; }
.lv { font-family: var(--mono); font-size: 14px; font-weight: 500; text-align: right; display: flex; flex-direction: column; line-height: 1.25; }
.lv small { font-size: 11px; color: var(--muted); font-weight: 400; }
.ledger.has-active .lrow:not(.on) .ltr i { opacity: .35; }
.lrow.on .lt { color: var(--accent-ink); font-weight: 600; }
/* columns */
.cols { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 8px; }
.col { display: flex; flex-direction: column; gap: 6px; padding: 6px 2px; border: 0; border-radius: 14px; background: transparent; }
button.col:hover { background: var(--surface-2); }
.cv { font-family: var(--mono); font-size: 11.5px; text-align: center; color: var(--fg); }
.cb { height: 140px; display: flex; align-items: flex-end; border-bottom: 1px dashed var(--line); }
.cb i { display: block; width: 100%; border-radius: 12px 12px 3px 3px; background: var(--accent); min-height: 3px; }
.cl { font-size: 11px; line-height: 1.25; text-align: center; color: var(--muted); min-height: 2.5em; overflow-wrap: break-word; }
.cols.has-active .col:not(.on) .cb i { opacity: .35; }
.col.on .cl { color: var(--accent-ink); font-weight: 600; }
/* dial */
.dialwrap { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; }
.dialbox { position: relative; width: 150px; height: 150px; flex: none; }
.dial { width: 100%; height: 100%; }
.dial .tk { stroke: var(--accent-soft); }
.dial .seg { cursor: pointer; }
.dial.has-active .seg:not(.on) { opacity: .3; }
.dialc { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
.dialc b { font-size: 30px; font-weight: 600; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.dialc span { font-size: 11.5px; color: var(--muted); }
.dialwrap .ledger { flex: 1 1 190px; min-width: 0; }

/* filters */
.filters { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; position: relative; z-index: 5; }
.frow { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.search { flex: 1 1 280px; display: flex; align-items: center; gap: 8px; padding: 0 12px; height: 40px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); color: var(--muted); }
.search:focus-within { border-color: var(--accent); }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; }
.sel { height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); display: flex; align-items: center; gap: 6px; font-size: 13px; }
.sel select { border: 0; background: transparent; outline: 0; max-width: 150px; }
.btn { height: 40px; padding: 0 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); display: inline-flex; align-items: center; gap: 6px; font-weight: 500; font-size: 13px; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.btn.sm { height: 32px; padding: 0 10px; border-radius: 10px; }
.btn[disabled] { opacity: .45; cursor: default; }
.fgroup { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.fgroup > .fl-label { font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 12.5px; color: var(--fg-2); }
button.chip:hover { border-color: var(--accent); }
button.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.chip .n { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
button.chip.zero { opacity: .45; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 1px 8px; font-size: 11px; text-transform: none; letter-spacing: 0; color: var(--fg-2); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.range { display: flex; align-items: center; gap: 6px; }
.range input { width: 86px; height: 34px; padding: 0 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
.dd { position: relative; }
.dd-btn { height: 34px; padding: 0 12px; display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); font-size: 13px; max-width: 280px; }
.dd-btn .v { color: var(--accent-ink); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dd-btn[aria-expanded="true"] { border-color: var(--accent); }
.dd-pop { position: fixed; top: 0; left: 0; z-index: 70; width: max-content; min-width: 240px; max-width: min(380px, calc(100vw - 24px)); border: 1px solid var(--line); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.dd-pop input[type=search] { height: 34px; padding: 0 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); outline: 0; }
.dd-list { max-height: 260px; overflow: auto; display: flex; flex-direction: column; }
.dd-row { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 8px; cursor: pointer; font-size: 13px; }
.dd-row:hover { background: var(--surface-2); }
.dd-row .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dd-row .n { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.dd-row.zero { opacity: .45; }
.dd-row input { accent-color: var(--accent); }
.dd-btn { cursor: pointer; white-space: nowrap; flex: none; }
.dd-btn .k { color: var(--muted); font-weight: 500; }
.dd-btn .v { min-width: 0; }
.dd-btn svg { width: 14px; height: 14px; flex: none; transition: transform .2s; }
.dd-btn[aria-expanded="true"] svg { transform: rotate(180deg); }
.dd-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
.dd-foot { display: flex; justify-content: flex-end; gap: 8px; }
.dd-row .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; }
.dd-row[for] { cursor: pointer; }
.dd-pop .range { padding: 2px 0; }
.dd-pop .range input { width: 110px; }
.dd-pop .dd-list { min-width: 0; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 6px 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-ink); font-size: 12px; font-weight: 500; border: 0; }
.pill svg { width: 13px; height: 13px; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
.toggle input { accent-color: var(--accent); width: 16px; height: 16px; }

/* table */
.tcard { overflow: hidden; }
.thead { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.tscroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 900px; }
th { position: sticky; top: 0; text-align: left; padding: 10px 14px; font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--surface-2); white-space: nowrap; border-bottom: 1px solid var(--line); }
th button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
th button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
th .orig { display: block; font-weight: 400; text-transform: none; letter-spacing: 0; font-size: 11px; color: var(--muted); opacity: .85; }
td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
tbody tr[data-i] { cursor: pointer; }
tbody tr[data-i]:hover td { background: var(--surface-2); }
tr.grp td { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; font-size: 12.5px; padding: 6px 14px; }
th.num { text-align: right; }
td.num { text-align: right; font-family: var(--mono); font-size: 12.5px; }
a.xl { color: inherit; text-decoration: none; }
a.xl:hover { color: var(--accent-ink); text-decoration: underline; }
a.xl.src { color: var(--accent-ink); }
td.rn { color: var(--muted); font-family: var(--mono); font-size: 12px; width: 1%; white-space: nowrap; }
.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.strong { font-weight: 600; }
.dim { color: var(--muted); }
.empty { padding: 44px 18px; text-align: center; color: var(--fg-2); }
.pager { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding: 12px 18px; }
.pager .sel { height: 34px; }
.vbar { display: inline-block; width: 64px; height: 6px; border-radius: 3px; background: var(--accent-soft); vertical-align: middle; margin-right: 8px; overflow: hidden; }
.vbar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.tag { display: inline-flex; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; }
.t1 { background: var(--chip1-bg); color: var(--chip1-fg); } .t2 { background: var(--chip2-bg); color: var(--chip2-fg); }
.t3 { background: var(--chip3-bg); color: var(--chip3-fg); } .t4 { background: var(--chip4-bg); color: var(--chip4-fg); }
.t5 { background: var(--chip5-bg); color: var(--chip5-fg); } .t6 { background: var(--chip6-bg); color: var(--chip6-fg); }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 12px; flex: none; }
.plat { display: flex; align-items: center; gap: 10px; }
.llm { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }

/* overview */
.sheets { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
.sheet { padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.sheet .ic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; }
.sheet h3 { margin: 0; font-size: 16px; }
.sheet ul { margin: 0; padding-left: 18px; color: var(--fg-2); font-size: 13px; display: flex; flex-direction: column; gap: 3px; }
.sheet .meta { display: flex; flex-wrap: wrap; gap: 6px; }
.dict td, .dict th { padding: 8px 12px; }
.dict table { min-width: 760px; }
.dict code { font-family: var(--mono); font-size: 12px; background: var(--surface-2); padding: 1px 6px; border-radius: 6px; }

/* sentiment + domain popup */
.tn { background: var(--surface-2); color: var(--fg-2); border: 1px solid var(--line); }
.cross { overflow: hidden; }
.cscroll { max-height: 420px; overflow: auto; }
.mwrap { position: fixed; inset: 0; z-index: 60; background: rgba(2,20,42, .45); display: grid; place-items: center; padding: 16px; }
.modal { width: min(780px, 100%); max-height: min(86vh, 800px); background: var(--surface); border: 1px solid var(--line); border-radius: 26px; box-shadow: var(--frame-shadow); display: flex; flex-direction: column; overflow: hidden; }
.mhead { padding: 18px 22px 14px; display: flex; gap: 14px; align-items: flex-start; border-bottom: 1px solid var(--line); }
.mhead h3 { margin: 0; font-size: 20px; letter-spacing: -.015em; overflow-wrap: anywhere; }
.msum { padding: 12px 22px; display: flex; flex-wrap: wrap; gap: 6px; border-bottom: 1px solid var(--line); background: var(--card); max-height: 132px; overflow: auto; flex: none; }
.chip[disabled] { opacity: .4; cursor: default; }
.mgl { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); align-self: center; }
.mbody { overflow: auto; padding: 4px 22px 8px; }
.mitem { padding: 13px 0; border-bottom: 1px dashed var(--line); display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.mitem:last-child { border-bottom: 0; }
.mitem .strong { overflow-wrap: anywhere; }
.mfoot { padding: 12px 22px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
/* drawer */
.scrim { position: fixed; inset: 0; background: rgba(2,20,42, .38); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); z-index: 50; background: var(--surface); border-left: 1px solid var(--line); box-shadow: -20px 0 50px rgba(6,44,87, .18); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.dhead { display: flex; align-items: center; gap: 8px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.dhead .ttl { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.iconbtn { width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); display: grid; place-items: center; }
.iconbtn:hover { background: var(--surface-2); }
.iconbtn[disabled] { opacity: .4; cursor: default; }
.dbody { flex: 1; overflow: auto; padding: 18px; display: flex; flex-direction: column; gap: 16px; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }
.dbody h3 { margin: 0; font-size: 17px; line-height: 1.35; overflow-wrap: anywhere; }
.fields { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 8px 14px; font-size: 13px; }
.fields dt { color: var(--muted); font-weight: 500; }
.fields dd { margin: 0; overflow-wrap: anywhere; }
.fields a, .dbody a { color: var(--accent-ink); }
.bubble { background: var(--surface-2); border-radius: 16px; padding: 12px 14px; max-width: 88%; overflow-wrap: anywhere; }
.bubble.me { align-self: flex-end; background: var(--accent-soft); color: var(--accent-ink); border-bottom-right-radius: 5px; }
.reply { border: 1px solid var(--line); background: var(--surface-2); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; overflow-wrap: anywhere; }
.reply .rh { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--fg-2); font-weight: 600; }
.longtext { white-space: pre-wrap; overflow-wrap: anywhere; padding: 12px 14px; background: var(--surface-2); border-radius: 14px; max-height: 46vh; overflow: auto; }
.mini { display: flex; flex-direction: column; gap: 2px; }
.mini button { display: flex; gap: 10px; align-items: baseline; text-align: left; border: 0; background: transparent; padding: 6px 8px; border-radius: 8px; width: 100%; }
.mini button:hover { background: var(--surface-2); }
.mini .k { font-family: var(--mono); font-size: 12px; color: var(--muted); min-width: 2.6em; }
.sechead { font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 0; }

@media (max-width: 900px) {
  .fields { grid-template-columns: 96px minmax(0, 1fr); }
}
@media (prefers-reduced-motion: no-preference) {
  .bar .fl, .vbar i { transition: width .25s ease; }
}
/* ===== Glassy warm skin: blurred room backdrop, frosted panels, dark-glass nav pills, coral + teal accents ===== */
.bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: linear-gradient(180deg, #E2F4F8 0%, #F2FAFC 42%, #FFFFFF 100%); }
.bg .b { position: absolute; will-change: transform; animation: drift 28s ease-in-out infinite alternate; }
.b1 { left: -14vw; top: -20vh; width: 64vw; height: 64vh; background: radial-gradient(closest-side, rgba(205,239,245,.95), rgba(205,239,245,0)); filter: blur(30px); }
.b2 { right: -4vw; top: -10vh; width: 30vw; height: 64vh; background: #05529C; opacity: .16; filter: blur(70px); border-radius: 22px; animation-delay: -7s; }
.b3 { left: 28vw; top: -14vh; width: 28vw; height: 34vh; background: #CDEFF5; opacity: .8; filter: blur(58px); border-radius: 22px; animation-delay: -13s; }
.b4 { left: -10vw; bottom: -24vh; width: 72vw; height: 56vh; background: radial-gradient(closest-side, rgba(205,239,245,.85), rgba(205,239,245,0)); filter: blur(24px); animation-delay: -3s; }
.b5 { right: -12vw; bottom: -20vh; width: 52vw; height: 52vh; background: radial-gradient(closest-side, rgba(34,173,197,.24), rgba(34,173,197,0)); filter: blur(30px); animation-delay: -10s; }
@keyframes drift { to { transform: translate3d(2.6vw, 2vh, 0) scale(1.06); } }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14.5px; line-height: 1.5; -webkit-font-smoothing: antialiased; min-height: 100vh; }

/* floating dark-glass top bar + tab pill */
.shell { max-width: 1280px; margin: 0 auto; padding: 14px 16px 120px; }
.topbar {
  position: sticky; top: calc(10px + env(safe-area-inset-top, 0px)); z-index: 40; display: flex; align-items: center; gap: 12px 14px; padding: 8px;
  border-radius: 999px; color: #fff; background: var(--glass-dark); border: 1px solid rgba(255,255,255,.26);
  box-shadow: 0 14px 40px rgba(6,44,87,.28), inset 0 1px 0 rgba(255,255,255,.22); -webkit-backdrop-filter: blur(26px) saturate(1.3); backdrop-filter: blur(26px) saturate(1.3);
}
.who { display: flex; align-items: center; gap: 10px; padding-right: 6px; min-width: 0; }
.avatar-w { width: 38px; height: 38px; border-radius: 50%; background: #fff; color: #062C57; display: grid; place-items: center; flex: none; }
.whotxt b { display: block; font-size: 13.5px; line-height: 1.2; font-weight: 600; white-space: nowrap; }
.whotxt span { font-size: 11.5px; color: rgba(255,255,255,.74); white-space: nowrap; }
.nav { position: relative; display: flex; gap: 2px; padding: 4px; border-radius: 999px; background: rgba(255,255,255,.12); overflow-x: auto; scrollbar-width: none; min-width: 0; flex: 0 1 auto; margin: 0 auto; }
.nav::-webkit-scrollbar { display: none; }
.nav button { position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 8px; width: auto; padding: 8px 16px; border: 0; border-radius: 999px; background: transparent; color: rgba(255,255,255,.88); font-weight: 500; font-size: 13.5px; white-space: nowrap; transition: color .25s; }
.nav button:hover { background: transparent; color: #fff; }
.nav button[aria-current="page"] { background: transparent; color: #062C57; font-weight: 600; }
.nav .n { margin-left: 0; font-family: var(--mono); font-size: 11.5px; color: inherit; opacity: .7; }
.nav button[aria-current="page"] .n { color: inherit; }
.nav .ind { position: absolute; z-index: 0; top: 4px; bottom: 4px; left: 0; width: 0; border-radius: 999px; background: #fff; box-shadow: 0 6px 16px rgba(6,44,87,.25); transition: transform .45s cubic-bezier(.3,.9,.25,1), width .45s cubic-bezier(.3,.9,.25,1); }
.cmd { flex: 1 1 200px; min-width: 0; display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 14px 0 10px; border-radius: 999px; background: rgba(255,255,255,.13); border: 1px solid rgba(255,255,255,.2); transition: background .25s, border-color .25s; }
.cmd:focus-within { background: rgba(255,255,255,.22); border-color: rgba(255,255,255,.5); }
.orb { width: 22px; height: 22px; border-radius: 50%; flex: none; background: radial-gradient(circle at 32% 28%, #fff 0, #BDF1F8 24%, #22ADC5 58%, #0F7C93 100%); box-shadow: 0 0 12px rgba(34,173,197,.65); }
.cmd input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: #fff; }
.cmd input::placeholder { color: rgba(255,255,255,.72); }
.circle { width: 40px; height: 40px; border-radius: 50%; border: 0; display: grid; place-items: center; flex: none; background: #fff; color: #062C57; box-shadow: 0 6px 16px rgba(6,44,87,.22); transition: transform .2s, box-shadow .2s; }
.circle:hover { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(6,44,87,.28); }
.circle:active { transform: scale(.94); }
.circle[disabled] { opacity: .5; cursor: default; transform: none; }

/* main glass panel */
.panel { margin-top: 14px; padding: 30px clamp(18px, 3vw, 38px) 40px; border-radius: 34px; display: flex; flex-direction: column; gap: 20px; min-width: 0; background: var(--glass-panel); border: 1px solid var(--hl); box-shadow: var(--glass-shadow); -webkit-backdrop-filter: blur(34px) saturate(1.3); backdrop-filter: blur(34px) saturate(1.3); }
.top h1 { margin: 0; display: inline; font-family: var(--font-head); font-size: clamp(25px, 3vw, 32px); line-height: 1.3; font-weight: 700; letter-spacing: -.02em; padding: 0 .14em; margin-left: -.14em; background: linear-gradient(transparent 62%, #CDEFF5 62%, #CDEFF5 92%, transparent 92%); -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.top p { margin: 6px 0 0; color: var(--fg-2); max-width: 70ch; }
[data-jump] { scroll-margin-top: 92px; }

/* floating bottom section pill */
.jump { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40; display: flex; align-items: center; gap: 2px; max-width: calc(100% - 24px); padding: 5px; border-radius: 999px; background: var(--glass-dark); border: 1px solid rgba(255,255,255,.26); box-shadow: 0 14px 40px rgba(6,44,87,.3), inset 0 1px 0 rgba(255,255,255,.22); -webkit-backdrop-filter: blur(26px) saturate(1.3); backdrop-filter: blur(26px) saturate(1.3); overflow-x: auto; scrollbar-width: none; }
.jump::-webkit-scrollbar { display: none; }
.jump button { border: 0; background: transparent; color: rgba(255,255,255,.88); padding: 8px 15px; border-radius: 999px; font-size: 13px; font-weight: 500; white-space: nowrap; transition: background .25s, color .25s; }
.jump button:hover { color: #fff; background: rgba(255,255,255,.14); }
.jump button.on { background: #fff; color: #062C57; font-weight: 600; }
.jump .circle { width: 34px; height: 34px; margin-left: 4px; background: #fff; color: #062C57; padding: 0; }
.jump .circle:hover { background: #fff; color: #062C57; }

/* glass cards */
.card { background: #fff; border: 1px solid var(--hl); border-radius: 20px; box-shadow: var(--shadow); }
.stat, .chart { border-radius: 24px; transition: transform .3s cubic-bezier(.2,.7,.2,1), box-shadow .3s, border-color .3s; }
.stat:hover, .chart:hover { transform: translateY(-3px); box-shadow: 0 26px 50px rgba(6,44,87,.16); border-color: rgba(5,82,156,.35); }
.card h2 { font-weight: 600; letter-spacing: -.01em; }
.big { font-size: 38px; font-weight: 700; letter-spacing: -.03em; }
.stat .l { font-weight: 500; }
.dpill { background: #F2F9FB; border-color: var(--hl); color: var(--fg-2); }
button.dpill:hover { background: #E4F3F7; border-color: var(--accent); color: var(--accent-ink); }
.sd { border-color: #fff; }
.sd.hv { background: #fff; }
.spark .gl { stroke: rgba(6,44,87,.18); }
.stat.hero { position: relative; overflow: hidden; color: #fff; background: linear-gradient(135deg, #1FA6C2 0%, #05529C 46%, #062C57 100%); border-color: rgba(255,255,255,.3); box-shadow: 0 1px 0 rgba(255,255,255,.25) inset, 0 20px 44px rgba(6,44,87,.3); }
.stat.hero::after { content: ""; position: absolute; right: -30%; top: -40%; width: 90%; height: 160%; border-radius: 50%; background: radial-gradient(closest-side, rgba(120,222,238,.35), rgba(120,222,238,0)); pointer-events: none; }
.stat.hero > * { position: relative; z-index: 1; }
.stat.hero .l, .stat.hero .s, .stat.hero .big small { color: rgba(255,255,255,.86); }
.stat.hero .dpill { background: rgba(255,255,255,.2); border-color: rgba(255,255,255,.35); color: #fff; }
.stat.hero button.dpill:hover { background: rgba(255,255,255,.34); color: #fff; border-color: #fff; }
.stat.hero .spark .ln { stroke: #fff; }
.stat.hero .spark .gl { stroke: rgba(255,255,255,.3); }
.stat.hero .sd { background: #fff; border-color: #0B4A8C; box-shadow: 0 0 0 1px #fff; }

/* charts */
.ltr { background: rgba(5,82,156,.1); }
.ltr i { background: linear-gradient(90deg, #22ADC5, #05529C); }
.lrow { border-bottom-color: var(--line); }
button.lrow:hover, button.col:hover { background: rgba(5,82,156,.07); }
.cb { border-bottom-color: rgba(6,44,87,.22); }
.cb i { background: linear-gradient(180deg, #D7F1F6, #B6E4EE); box-shadow: inset 0 0 0 1px rgba(5,82,156,.12); }
.col.peak .cb i { background: linear-gradient(180deg, #22ADC5, #05529C); box-shadow: 0 6px 16px rgba(5,82,156,.3); }
.col.on .cb i { background: linear-gradient(180deg, #22ADC5, #05529C); }
.cols.has-active .col:not(.on) .cb i { opacity: .5; }
.dial .tk { stroke: rgba(5,82,156,.12); }

/* filters, inputs, buttons, chips */
.search, .sel, .range input, .dd-btn, .dd-pop input[type=search] { background: #fff; border: 1px solid rgba(6,44,87,.16); }
.search:focus-within, .dd-btn[aria-expanded="true"] { border-color: var(--accent); background: #fff; }
.btn { background: #fff; border: 1px solid rgba(6,44,87,.16); transition: background .2s, transform .2s, box-shadow .2s; }

.btn:active { transform: scale(.97); }
.btn.primary { background: linear-gradient(135deg, #2BB9D2, #1FA0BC); color: #03203F; border-color: transparent; font-weight: 700; }
.btn.primary:hover { background: linear-gradient(135deg, #43C8DF, #2BB0CB); box-shadow: 0 8px 18px rgba(34,173,197,.4); }
.chip { background: #fff; border-color: rgba(6,44,87,.16); color: var(--fg-2); transition: background .2s, color .2s, border-color .2s; }
button.chip:hover { border-color: var(--accent); background: #F2F9FB; }
button.chip[aria-pressed="true"] { background: #062C57; border-color: #062C57; color: #fff; font-weight: 600; }

.seg { border-color: rgba(6,44,87,.16); background: #fff; }

.pill { background: #062C57; color: #fff; }
.dd-pop { background: rgba(255,255,255,.97); border-color: rgba(6,44,87,.14); box-shadow: 0 24px 60px rgba(6,44,87,.22); -webkit-backdrop-filter: blur(24px) saturate(1.3); backdrop-filter: blur(24px) saturate(1.3); }
.dd-row:hover { background: rgba(5,82,156,.08); }
.dd-btn .v { color: var(--accent-ink); }
.dd-btn.on, .dd-btn.on[aria-expanded="true"] { background: #062C57; border-color: #062C57; color: #fff; }
.dd-btn.on .k { color: rgba(255,255,255,.66); } .dd-btn.on .v { color: #fff; }
.dd-btn:hover { background: #F2F9FB; } .dd-btn.on:hover { background: #0B3B70; }
.toggle input, .dd-row input { accent-color: #05529C; }

/* tables */
th { background: #F1F7FA; }

/* drawer + modal glass */

.msum { background: rgba(5,82,156,.05); }
.bubble.me { background: rgba(5,82,156,.16); color: var(--accent-ink); }
.reply, .longtext, .bubble { background: #F1F7FA; }
.iconbtn { background: #fff; border-color: rgba(6,44,87,.16); }
.iconbtn:hover { background: #F2F9FB; }
#tip { background: #062C57; color: #fff; }


/* sentiment tags + graphs */
.sp { background: rgba(40,167,69,.16); color: #1B6E2F; }
.sn { background: rgba(180,22,22,.12); color: #8E1212; }
.su { background: rgba(255,181,7,.28); color: #6B4A00; }
.chart.wide { flex: 1 1 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; font-size: 12px; color: var(--fg-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .dot { width: 10px; height: 10px; border-radius: 3px; }
.mix { display: flex; flex-direction: column; }
.mrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 14px; align-items: center; padding: 11px 8px; margin: 0 -8px; width: calc(100% + 16px); border: 0; border-bottom: 1px dashed var(--line); border-radius: 12px; background: transparent; text-align: left; }
.mrow:last-child { border-bottom: 0; }
button.mrow:hover { background: rgba(5,82,156,.06); }
.mrow .nm { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrow.all .nm { font-weight: 700; }
.mrow .tot { font-family: var(--mono); font-size: 13px; text-align: right; }
.mrow .tag { justify-self: end; white-space: nowrap; }
.sbar { display: flex; height: 12px; border-radius: 7px; overflow: hidden; background: rgba(6,44,87,.06); box-shadow: inset 0 0 0 1px rgba(6,44,87,.08); }
.sbar i { display: block; height: 100%; min-width: 0; }
.trendbar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between; }
.trendbar .chips { flex: 1 1 320px; }
.trendbody { overflow-x: auto; padding: 4px 0 2px; }
.plot { position: relative; height: 230px; margin: 8px 0 0 44px; min-width: 620px; border-bottom: 1px solid rgba(6,44,87,.3); }
.plot .gl { position: absolute; left: 0; right: 0; height: 0; border-top: 1px dashed rgba(6,44,87,.18); }
.plot .gl em { position: absolute; right: calc(100% + 8px); top: -8px; font-style: normal; font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
.tcols { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(var(--nc), minmax(0, 1fr)); gap: 7px; padding: 0 3px; align-items: stretch; }
.tcol { display: flex; flex-direction: column-reverse; padding: 0; border: 0; background: transparent; border-radius: 8px 8px 2px 2px; overflow: hidden; cursor: pointer; transition: transform .2s, filter .2s, background .2s; }
.tcol i { display: block; width: 100%; min-height: 3px; flex: none; border-top: 1px solid rgba(255,255,255,.5); }
.tcol:hover { background: rgba(5,82,156,.08); filter: brightness(1.06) saturate(1.05); }

.subnav { display: inline-flex; gap: 2px; padding: 4px; margin-bottom: 14px; max-width: 100%; overflow-x: auto; scrollbar-width: none; border-radius: 999px; background: #fff; border: 1px solid var(--hl); box-shadow: 0 6px 16px rgba(6,44,87,.06); }
.subnav::-webkit-scrollbar { display: none; }

.subnav button:hover { background: rgba(5,82,156,.08); }
.subnav button[aria-current="true"] { background: #062C57; color: #fff; font-weight: 600; }

.dtab { min-width: 0; font-size: 12.5px; }

.dtab tr:last-child td { border-bottom: 0; }
/* motion */
@media (prefers-reduced-motion: no-preference) {
  .view.enter { animation: pageIn .5s cubic-bezier(.2,.7,.2,1) both; }
  .view.enter .stat, .view.enter .chart, .view.enter .sheet, .view.enter .cross, .view.enter .filters, .view.enter .tcard { animation: rise .6s cubic-bezier(.2,.7,.2,1) both; }
  .view.enter .stat:nth-child(2), .view.enter .chart:nth-child(2), .view.enter .sheet:nth-child(2) { animation-delay: .06s; }
  .view.enter .stat:nth-child(3), .view.enter .chart:nth-child(3), .view.enter .sheet:nth-child(3) { animation-delay: .12s; }
  .view.enter .stat:nth-child(4), .view.enter .chart:nth-child(4) { animation-delay: .18s; }
  .view.enter .stat:nth-child(5), .view.enter .chart:nth-child(5) { animation-delay: .24s; }
  .view.enter .stat:nth-child(6), .view.enter .chart:nth-child(6) { animation-delay: .30s; }
  .view.enter .stat:nth-child(7) { animation-delay: .36s; }
  .view.enter .cross, .view.enter .filters { animation-delay: .2s; }
  .view.enter .tcard { animation-delay: .28s; }
  .view.enter .ltr i { transform-origin: left; animation: growX .9s cubic-bezier(.2,.7,.2,1) .25s both; }
  .view.enter .cb i { transform-origin: bottom; animation: growY .9s cubic-bezier(.2,.7,.2,1) .25s both; }
  .view.enter .dial { animation: dialIn 1s cubic-bezier(.2,.7,.2,1) .15s both; }
  .drawer:not([hidden]) { animation: slideIn .38s cubic-bezier(.2,.8,.2,1); }
  .scrim:not([hidden]), .mwrap:not([hidden]) { animation: fade .25s ease; }
  .modal { animation: pop .32s cubic-bezier(.2,.8,.2,1); }
  .dd-pop:not([hidden]), [id$="-fgroups"]:not([hidden]) { animation: dropIn .28s cubic-bezier(.2,.8,.2,1); }
  @keyframes pageIn { from { opacity: 0; transform: translateY(10px); } }
  @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.985); } }
  @keyframes growX { from { transform: scaleX(0); } }
  @keyframes growY { from { transform: scaleY(0); } }
  @keyframes dialIn { from { opacity: 0; transform: rotate(-50deg) scale(.9); } }
  @keyframes slideIn { from { transform: translateX(40px); opacity: 0; } }
  @keyframes fade { from { opacity: 0; } }
  @keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.97); } }
  @keyframes dropIn { from { opacity: 0; transform: translateY(-6px); } }
}
@media (prefers-reduced-motion: reduce) { .bg .b { animation: none; } }

/* responsive */
.nav { flex: 0 0 auto; max-width: 100%; }
.cmd { flex: 1 1 140px; min-width: 120px; }
@media (max-width: 1180px) { .whotxt { display: none; } .who { padding-right: 0; } }
@media (max-width: 900px) {
  .topbar { flex-wrap: wrap; border-radius: 28px; }
  .nav { order: 3; flex: 1 1 100%; margin: 0; max-width: none; }
  .cmd { order: 2; }
  .who { flex: 1 1 auto; }
  .whotxt { display: block; }
  .whotxt span { display: none; }
}
@media (max-width: 767px) {
  .shell { padding: 10px 10px 110px; }
  .topbar { position: relative; top: 0; }
  .panel { padding: 22px 14px 28px; border-radius: 26px; -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
  .topbar, .jump, .drawer, .modal, .dd-pop { -webkit-backdrop-filter: blur(14px) saturate(1.2); backdrop-filter: blur(14px) saturate(1.2); }
  .cmd { flex: 1 1 100%; }
  .big { font-size: 34px; }
  .jump button { padding: 8px 12px; }
}
/* browsers without backdrop-filter get denser surfaces so text stays readable */
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .topbar, .jump { background: rgba(6,44,87,.97); }
  .panel { background: rgba(244,249,252,.95); }
  .drawer, .modal, .dd-pop { background: #fff; }
  .card { background: #fff; }
}
.card h2, .sheet h3, .mhead h3, .dbody h3, .big, .dialc b, .whotxt b { font-family: var(--font-head); }
.card h2 { letter-spacing: -.005em; } .big { letter-spacing: -.02em; } .dialc b { letter-spacing: -.02em; }
.th, th { font-family: var(--font); }
.mx { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; align-items: start; }
.mx .card { padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }

.loading { padding: 28px 24px; display: flex; flex-direction: column; gap: 8px; }

.thbtn{background:none;border:0;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:4px;padding:0}.thbtn:hover{color:var(--accent-ink)}.thbtn svg{width:12px;height:12px}

header.top{position:relative}.vaction{position:absolute;top:6px;right:0}.vabtn{white-space:nowrap}@media (max-width:760px){.vaction{position:static;margin-top:12px}}

.bm .pnrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bm .ipw{position:relative;flex:none}
.bm .ibtn{width:22px;height:22px;border-radius:50%;border:1px solid rgba(6,44,87,.28);background:var(--surface,#fff);color:var(--accent-ink);font:italic 700 12px/1 var(--font-head);cursor:help;display:grid;place-items:center;padding:0}
.bm .ibtn:hover,.bm .ibtn:focus-visible{background:var(--accent-ink);color:#fff;outline:none}
.bm .ipop{display:none;position:absolute;top:calc(100% + 8px);right:-6px;width:min(270px,78vw);z-index:30;background:var(--surface,#fff);color:var(--fg,#0b2540);border:1px solid rgba(6,44,87,.16);border-radius:12px;box-shadow:0 14px 34px rgba(6,44,87,.2);padding:12px 14px;font-size:12.5px;line-height:1.45}
.bm .ipw:hover .ipop,.bm .ipw:focus-within .ipop{display:block}
.bm .pc:hover,.bm .pc:focus-within{position:relative;z-index:6}
.bm .ipt{font:600 11px var(--font-head);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:8px 0 3px}.bm .ipt:first-child{margin-top:0}
.bm .ipr{display:flex;justify-content:space-between;gap:10px}.bm .ipr span{color:var(--fg-2)}.bm .ipr b{font-weight:600;text-align:right}
.bm .ipn{margin-top:2px;color:var(--s-pos-ink,#17803d);font-weight:600}
.bm .pc .pout{gap:8px}

/* chart cards: balanced columns, no open gaps under short cards */
.charts>.mcol{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:14px}
.charts>.mcol>.chart{flex:none;width:100%;box-sizing:border-box}
.charts>.chart.wide{flex:1 1 100%!important}
.chart.wide .mix{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));column-gap:36px}
.chart.wide .mix .mrow.all{grid-column:1/-1}

.bhi{background:rgba(40,167,69,.2);color:#146c32;font-weight:700;border-radius:4px;padding:0 3px;box-shadow:inset 0 -1px 0 rgba(40,167,69,.4)}
tbody tr.tot td{background:rgba(5,82,156,.08);font-weight:700;border-bottom:2px solid rgba(5,82,156,.28);cursor:default}
tbody tr.tot .note{font-weight:400}
.bm .hbtx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bm .hb.wl .hbr{grid-template-columns:minmax(130px,44%) minmax(0,1fr) auto;align-items:start}.bm .hb.wl .hbtx{white-space:normal;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;line-height:1.35}.bm .hb.wl .hbt{margin-top:6px}
.bm .agroup{font:600 12px var(--font-head);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:20px 0 10px}
.bm .spc .pnrow{min-height:3.1em;align-items:flex-start}.bm .spc .pins{align-items:start}.bm .spc .pf>span{display:block;height:36px}

.bm .srows{display:flex;flex-direction:column;gap:11px}.bm .srow{display:grid;grid-template-columns:minmax(120px,32%) 1fr 56px;gap:10px;align-items:center;font-size:13px}.bm .srow .sl{color:var(--fg-2)}
.bm .strack{height:16px;background:var(--surface-2,#eef2f7);border-radius:8px;overflow:hidden}.bm .sfill{height:100%;display:flex;border-radius:8px;overflow:hidden}.bm .sfill i{display:block;min-width:3px;border-right:2px solid var(--surface,#fff)}.bm .sfill i:last-child{border-right:0}.bm .sv{text-align:right;font:600 13px var(--font-head)}
.bm .legendx{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:2px 0 6px}.bm .legendx i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.bm .lcgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,255px),1fr));gap:14px;margin-bottom:14px}.bm .lc{width:100%;height:auto;display:block;margin-top:6px}
.bm .scols{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:5px;height:230px;margin-top:8px}.bm .scol{display:flex;flex-direction:column;min-width:0;height:100%}.bm .sct{font:600 10.5px var(--font);text-align:center;color:var(--fg-2);height:16px;white-space:nowrap}
.bm .scw{flex:1;display:flex;align-items:flex-end;min-height:0}.bm .scbar{width:100%;display:flex;flex-direction:column-reverse;border-radius:5px 5px 0 0;overflow:hidden}.bm .scbar i{display:block;min-height:1px}.bm .scl{font-size:10.5px;color:var(--muted);text-align:center;height:18px;line-height:18px}
.bm .c2{display:grid;grid-template-columns:minmax(250px,1fr) 2.2fr;gap:14px;margin-bottom:14px;align-items:start}@media (max-width:900px){.bm .c2{grid-template-columns:1fr}}

.bm .org{display:flex;flex-direction:column;gap:0;align-items:stretch;margin:6px 0 14px}.bm .orgtop{padding:16px 22px;max-width:560px;width:100%;margin:0 auto;text-align:center;position:relative}.bm .orgtop h3{margin:2px 0 4px;font:600 18px var(--font-head)}
.bm .orgtop::after{content:'';position:absolute;left:50%;bottom:-18px;height:18px;border-left:2px solid var(--line)}
.bm .orgrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px;border-top:2px solid var(--line);margin-top:18px;padding-top:16px}
.bm .orgteam{padding:14px 16px;display:flex;flex-direction:column;gap:6px}.bm .orgteam h3{margin:0;font:600 15px var(--font-head)}.bm .orgteam ul{margin:2px 0 0;padding-left:16px;font-size:12.5px;color:var(--fg-2);display:flex;flex-direction:column;gap:3px}.bm .orgstat{font-size:12.5px;color:var(--fg-2)}.bm .orgstat b{color:var(--fg)}

.bm .hb.wl .hbr{grid-template-columns:minmax(120px,42%) minmax(0,1fr) auto;align-items:center}.bm .hb.wl .hbl{white-space:normal;overflow:visible}.bm .hb.wl .hbl small{white-space:normal;line-height:1.3}.bm .hb.wl .hbtx{white-space:normal;-webkit-line-clamp:3}
.bm .capcall{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--accent-soft);display:flex;flex-direction:column;gap:4px;font-size:12.5px;line-height:1.5;color:var(--fg-2)}.bm .capcall b{font:600 17px var(--font-head);color:var(--fg)}.bm .capcall.neg{background:rgba(180,22,22,.08)}.bm .capcall.neg b{color:#B41616}
.bm .charts>.card{min-width:0;overflow-wrap:anywhere}

/* Share of voice: responses */
.rsp-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0 4px}
.rsp-sel{flex:1 1 260px;min-width:0;height:40px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);font:inherit;font-size:14px;padding:0 10px}
.rsp-q{margin:12px 0 6px}
.rsp-list{margin-top:6px}
details.rsp{border-top:1px dashed var(--line)}
details.rsp:first-child{border-top:0}
details.rsp>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:13px 0}
details.rsp>summary::-webkit-details-marker{display:none}
details.rsp>summary::before{content:'';width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;flex:none;margin-right:2px}
details.rsp[open]>summary::before{transform:rotate(45deg)}
.rsp-body{padding:0 0 16px 17px;max-width:78ch;overflow-wrap:anywhere}
.rsp-body .rp{margin:0 0 9px;line-height:1.6;font-size:14px}
.rsp-body .rh{font-weight:700;margin:14px 0 6px;line-height:1.35}
.rsp-body .rh1{font-size:17px}.rsp-body .rh2{font-size:15.5px}.rsp-body .rh3{font-size:14px}
.rsp-body .rli{position:relative;margin:0 0 6px;padding-left:18px;line-height:1.55;font-size:14px}
.rsp-body .rli::before{content:'';position:absolute;left:5px;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--muted)}
.rsp-body .rli.l2{margin-left:20px}.rsp-body .rli.l3{margin-left:40px}
.rsp-body .tscroll{margin:8px 0 12px}
.rsp-body td,.rsp-body th{font-size:13px}
.rsp-src{margin-top:14px;font-size:12px;color:var(--muted)}
.rsp-src ol{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.rsp-src a{color:var(--accent);text-decoration:none;overflow-wrap:anywhere}.rsp-src a:hover{text-decoration:underline}
.sov-pair{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.sov-pair>.card{flex:1 1 420px;min-width:0}
.bred{background:rgba(180,22,22,.12);color:#8F1313;font-weight:600;box-shadow:inset 0 -1px 0 rgba(180,22,22,.3)}
/* our brand in green */
.dtab tr.hl td{background:rgba(40,167,69,.13)}
.dtab tr.hl td:first-child{color:#146C32}
.stat[style*="--s-pos"] .num{color:#146C32}
.whotxt b{color:#8CE6A8}
</style>
